pre-commit:
  parallel: true
  jobs:
    - name: biome check
      run: git diff --cached --name-only --diff-filter=d -- '*.ts' '*.tsx' '*.json' '*.css' | xargs -r pnpm biome check --no-errors-on-unmatched

    - name: typecheck
      run: pnpm typecheck

    - name: i18n key parity
      glob: "apps/web/lib/i18n/locales/*.yaml"
      run: pnpm check:i18n
