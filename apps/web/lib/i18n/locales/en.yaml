    accessHelp: "Grant permissions to groups under Admin → Access.\n• marketing.view: read dashboards, register and knowledge; raise issues (executives, other departments)\n• marketing.operate: edit register, dashboards, change requests, CSV imports (trained operators)\n• marketing.review: approve changes, documents and reconciliations (never your own)\n• marketing.manage: connectors, credentials and retention\nmanage includes operate and view. Grant review separately."
