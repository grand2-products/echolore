version: 2
updates:
  # JS/TS dependencies (pnpm workspace)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  # Docker image bases
  - package-ecosystem: docker
    directory: "/apps/api"
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: "/apps/web"
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: "/apps/worker"
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: "/apps/updater"
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions versions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies
    commit-message:
      prefix: "chore(ci)"
